<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<meta name="description" content="Uma aproximação para conectar você a tudo que importa.">
<title>NFC Central — conexões inteligentes</title>
<style>
:root{--bg:#f7f8fb;--ink:#18243a;--sub:#64748b;--line:#e5e9f1;--acc:#355fee;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{text-decoration:none;color:inherit}.top{height:75px;background:#111b2c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1060px)/2))}
.brand{font-weight:800;font-size:20px;letter-spacing:-.6px}.brand span{color:#8cafef}.nav{font-size:13px;color:#ccd8f1}.nav a{padding:9px 12px;border:1px solid #46546b;border-radius:9px}
.shell{max-width:1080px;margin:auto;padding:0 20px 80px}.hero{padding:94px 0 45px;max-width:680px}.eyebrow{color:#3864dd;font-size:11px;font-weight:800;letter-spacing:2.5px}
h1{font-size:clamp(37px,6vw,65px);letter-spacing:-2.5px;line-height:1.06;margin:20px 0 18px}.hero h1 em{font-style:normal;color:#335de8}.subtitle{color:#6b788d;line-height:1.8;font-size:17px}.primary{display:inline-flex;background:#355fee;color:white;padding:14px 23px;border-radius:12px;font-weight:700;margin-top:14px;align-items:center;gap:10px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:50px}.feature{background:white;border:1px solid var(--line);border-radius:17px;padding:24px;box-shadow:0 7px 30px #18243a08}.feature b{display:block;margin:15px 0 7px}.feature p{font-size:14px;line-height:1.6;color:#64748b;margin:0}.feature i{font-size:24px;font-style:normal;color:#3864dd}
.profileWrap{min-height:calc(100vh - 76px);display:grid;place-items:start center;padding:44px 18px 70px}
.profile{--primary:#355fee;--surface:#fff;--txt:#15243c;--secondary:#738093;color:var(--txt);background:var(--surface);width:min(100%,480px);border:1px solid #e6eaf2;box-shadow:0 25px 80px #23345513;border-radius:28px;padding:35px 27px 23px;text-align:center}
.profile.dark{--primary:#a3c0ff;--surface:#151b28;--txt:#f3f7ff;--secondary:#a9b3c7;background:#151b28;border-color:#313b51}
.profile.orange{--primary:#ed701c;--surface:#fff;--txt:#27231f;--secondary:#77706a}
.profile.sand{--primary:#a38158;--surface:#fffcf7;--txt:#33291f;--secondary:#887c6e}
.profile.green{--primary:#188b6f;--surface:#fff;--txt:#19362e;--secondary:#6e807b}
.profile.purple{--primary:#815ae2;--surface:#fff;--txt:#2c213f;--secondary:#897e9a}
.avatar{height:88px;width:88px;display:grid;place-items:center;margin:auto auto 21px;background:linear-gradient(135deg,var(--primary),#bfcdf4);color:#fff;border-radius:25px;font-size:37px;font-weight:800;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}.micro{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--primary);text-transform:uppercase}
.profile h1{font-size:32px;letter-spacing:-1.5px;margin:14px 0 8px;line-height:1.2}.desc{color:var(--secondary);font-size:14px;line-height:1.7;margin:0 auto 29px;max-width:345px;white-space:pre-line}
.links{display:grid;gap:12px}.link{display:flex;align-items:center;text-align:left;gap:14px;background:var(--surface);color:var(--txt);padding:15px 16px;border:1px solid #dce3ef;border-radius:13px;min-height:59px;font-weight:700;font-size:14px;transition:.2s}
.link:hover{border-color:var(--primary);transform:translateY(-1px)}.dark .link{border-color:#364157}.icon{font-size:20px;color:var(--primary);width:23px;flex-shrink:0;text-align:center}.go{margin-left:auto;color:var(--primary)}
.foot{color:var(--secondary);font-size:11px;margin:30px 0 3px}.empty{padding:50px 10px;text-align:center;color:#66748a}.empty h2{color:#233455}
@media(max-width:650px){.nav{font-size:11px}.features{grid-template-columns:1fr}.hero{padding-top:64px}.profileWrap{padding:20px 12px 60px}.profile{padding:30px 21px 22px;border-radius:24px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="./">✦ NFC<span>Central</span></a><div class="nav"><a href="./painel/">Painel de gestão ↗</a></div></header>
<main id="app" class="shell"></main>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var q=new URLSearchParams(location.search), slug=(q.get("empresa")||"").toLowerCase().trim(),acao=q.get("acao")||"";
if(q.has("admin")){location.replace(new URL("painel/",location.href).href);return}
var base=new URL("./",location.href).href;
var titles={google:"Avaliar no Google",instagram:"Instagram",whatsapp:"WhatsApp",maps:"Localização",menu:"Cardápio",booking:"Agendamento",website:"Site",pix:"Pagamento Pix"};
var symbols={google:"★",instagram:"◎",whatsapp:"◉",maps:"⌖",menu:"☰",booking:"▣",website:"↗",pix:"◇",custom:"↗"};
var keys=Object.keys(titles);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safe(u){try{var x=new URL(String(u));return x.protocol==="https:"||x.protocol==="http:"}catch(e){return false}}
function theme(t){return ["blue","dark","orange","sand","green","purple"].includes(t)?t:"blue"}
function home(){app.innerHTML='<div class="hero"><div class="eyebrow">PÁGINAS INTELIGENTES PARA NFC E QR</div><h1>Um toque.<br><em>Infinitas conexões.</em></h1><p class="subtitle">Conecte o público ao Google, Instagram, WhatsApp, cardápio e muito mais. Atualize os links sem regravar a placa.</p><a class="primary" href="?empresa=demo">Ver demonstração ↗</a></div><div class="features"><div class="feature"><i>◈</i><b>Endereço permanente</b><p>Um link único para cada placa ou cartão.</p></div><div class="feature"><i>↗</i><b>Atualização online</b><p>Altere os destinos pelo painel do NFC Central.</p></div><div class="feature"><i>▣</i><b>Modelos personalizáveis</b><p>Monte uma página adequada a cada tipo de negócio.</p></div></div>'}
function notFound(){app.className="shell";app.innerHTML='<section class="empty"><h2>Página indisponível</h2><p>Confira o endereço da placa ou fale com o responsável.</p></section>'}
if(!slug){home();return}
app.className="profileWrap";app.innerHTML='<section class="profile"><p>Carregando página...</p></section>';
fetch(new URL("data/clientes.json",base).href+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("Erro ao carregar");return r.json()}).then(function(data){
var c=(data.clientes||[]).find(function(x){return x.slug===slug&&x.status!=="inativo"});if(!c){notFound();return}
var ln=c.links||{};
if(acao&&keys.includes(acao)&&safe(ln[acao])){location.replace(ln[acao]);return}
var buttons=keys.filter(function(k){return safe(ln[k])}).map(function(k){return {label:titles[k],url:ln[k],tipo:k}});
if(Array.isArray(c.extras))c.extras.slice(0,15).forEach(function(x){if(x&&safe(x.url)&&String(x.titulo||"").trim())buttons.push({label:String(x.titulo).slice(0,60),url:x.url,tipo:"custom"})});
document.title=String(c.nome||"Página")+" · NFC Central";
var icon=String(c.nome||"N").charAt(0).toUpperCase();
var photo=safe(c.foto)?'<img src="'+esc(c.foto)+'" alt="Foto de '+esc(c.nome||"empresa")+'" referrerpolicy="no-referrer">':esc(icon);
var links=buttons.map(function(b){return '<a class="link" href="'+esc(b.url)+'" target="_blank" rel="noopener noreferrer"><span class="icon">'+(symbols[b.tipo]||"↗")+'</span><span>'+esc(b.label)+'</span><span class="go">↗</span></a>'}).join("");
app.innerHTML='<section class="profile '+theme(c.tema)+'"><div class="avatar">'+photo+'</div><span class="micro">Conecte-se com a gente</span><h1>'+esc(c.nome||"Empresa")+'</h1><p class="desc">'+esc(c.descricao||"Tudo o que você precisa em um só lugar.")+'</p><div class="links">'+(links||'<p class="desc">Links em preparação.</p>')+'</div><p class="foot">Criado com NFC Central • Conexões inteligentes</p></section>';
}).catch(function(){app.innerHTML='<section class="empty"><h2>Sem conexão</h2><p>Não conseguimos carregar esta página agora.</p></section>'})
})();
</script>
</body></html>
