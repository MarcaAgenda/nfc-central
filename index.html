<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2f">
<title>NFC Central — conexões inteligentes</title>
<style>
:root{--ink:#142239;--sub:#637187;--line:#e5eaf1;--bg:#f5f7fb;--blue:#2861e8;--dark:#101b2f;--white:#fff}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}
a{text-decoration:none;color:inherit}.btn,button{cursor:pointer}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:white;border:0;border-radius:11px;padding:12px 17px;font-weight:650}.btn.light{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0ef;color:#c33535}.btn:disabled{opacity:.5;cursor:not-allowed}
header{height:75px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1060px)/2));gap:12px}.brand{font-size:19px;font-weight:800;letter-spacing:-.6px}.brand i{font-style:normal;color:#74b1ff}.tag{font-size:11px;letter-spacing:1.4px;color:#a9bbd7}.container{max-width:1060px;padding:28px 22px 80px;margin:auto}.hero{margin:65px auto;text-align:center;max-width:800px}.eyebrow{font-weight:750;font-size:12px;letter-spacing:2px;color:var(--blue)}h1{font-size:clamp(36px,5.6vw,58px);line-height:1.1;letter-spacing:-2.5px;margin:19px 0}h1 em{color:var(--blue);font-style:normal}.hero p{font-size:18px;line-height:1.7;color:var(--sub);max-width:620px;margin:0 auto 25px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:65px}.feature,.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:23px;box-shadow:0 8px 32px #111f3810}.feature .sym{font-size:25px;color:var(--blue)}.feature h3{margin:15px 0 7px;font-size:16px}.feature p{font-size:14px;color:var(--sub);line-height:1.6;margin:0}
.profile{max-width:460px;margin:35px auto 0;text-align:center}.avatar{width:75px;height:75px;background:linear-gradient(135deg,#2760e4,#82b6ff);color:#fff;border-radius:23px;display:grid;place-items:center;font-size:33px;font-weight:850;margin:0 auto 17px}.profile h1{font-size:32px;letter-spacing:-1px;margin:8px 0}.profile p{color:var(--sub);line-height:1.6;margin:8px auto 23px}.linkstack{display:grid;gap:11px}.linkitem{padding:17px 18px;text-align:left;display:flex;align-items:center;gap:15px;border:1px solid #dce5f0;border-radius:13px;background:white;font-weight:700}.linkitem span{font-size:21px}.linkitem b{margin-left:auto;color:var(--blue)}.tiny{color:var(--sub);font-size:12px;line-height:1.6}.profile .tiny{margin-top:29px}
.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.adminbar{background:#e8eefb;padding:9px 22px;text-align:center;color:#3e5682;font-size:12px}.title{font-size:28px;letter-spacing:-1px;margin:0 0 4px}.muted{color:var(--sub);font-size:14px;line-height:1.5}.section{margin-top:24px}.pill{padding:5px 10px;border-radius:99px;background:#e8f7eb;color:#158044;font-size:11px;font-weight:700}.pill.off{background:#f7eaea;color:#a94444}.client{display:grid;grid-template-columns:42px minmax(110px,1fr) auto auto;gap:13px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.initial{width:42px;height:42px;background:#e8eefb;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#2f5fba}.client strong{display:block}.client small{display:block;color:var(--sub);margin-top:3px;overflow-wrap:anywhere}.actions{display:flex;gap:7px}.actions button{border:1px solid #dfe5ee;background:white;border-radius:8px;padding:8px;color:#294b7e;font-size:12px;font-weight:650}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid #dae2ed;border-radius:10px;background:white;outline:none;color:var(--ink)}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2861e81c}input[readonly]{background:#f4f6f9}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-size:12px;font-weight:750;color:#42516a;margin-bottom:6px}.field{margin-bottom:2px}.full{grid-column:1/-1}.url{font-size:13px;margin:5px 0;overflow-wrap:anywhere;display:block}.linktable{display:grid;gap:10px}.linkrow{background:#f6f9ff;border:1px solid #e1e9f8;border-radius:10px;padding:12px}.linkrow strong{font-size:13px}.linkrow .url{color:#355da6}.linkrow .actions{margin-top:9px}.qrbox{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.qrbox img{background:#fff;max-width:210px;width:100%;border:1px solid var(--line);padding:8px;border-radius:8px}
.notice{font-size:13px;line-height:1.6;color:#62502d;background:#fff9e9;border:1px solid #f4e6bb;padding:14px;border-radius:11px}.hidden{display:none!important}.status{position:fixed;bottom:17px;right:17px;background:#142239;color:white;border-radius:11px;padding:12px 18px;box-shadow:0 12px 28px #18294545;z-index:5;font-size:13px;max-width:340px}.search{max-width:300px}
@media(max-width:640px){header{padding:0 20px}.tag{display:none}.features{grid-template-columns:1fr;margin-top:35px}.hero{margin:36px auto}.container{padding:22px 16px 70px}.client{grid-template-columns:36px 1fr;gap:8px}.client>.pill,.client>.actions{grid-column:2}.actions{flex-wrap:wrap}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}.profile{margin-top:22px}}
</style></head><body>
<header><a class="brand" href="./">✦ NFC<i>Central</i></a><span class="tag">TECNOLOGIA QUE CONECTA</span></header>
<div id="app" class="container"></div><div id="toast" class="status hidden" role="status"></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app"),toast=document.getElementById("toast");
var params=new URLSearchParams(location.search),slug=(params.get("empresa")||"").toLowerCase(),acao=params.get("acao")||"",admin=params.has("admin");
var base=new URL("./",location.href).href;var fileUrl=new URL("data/clientes.json",base).href;
var fields=["google","instagram","whatsapp","maps","menu","booking","website"];
var names={google:"Avaliar no Google",instagram:"Instagram",whatsapp:"WhatsApp",maps:"Localização",menu:"Cardápio",booking:"Agendamento",website:"Site"};
var icons={google:"★",instagram:"◎",whatsapp:"◉",maps:"⌖",menu:"☰",booking:"▣",website:"↗"};
function h(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function tell(s){toast.textContent=s;toast.classList.remove("hidden");setTimeout(function(){toast.classList.add("hidden")},3700)}
function valid(u){try{var x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"}catch(e){return false}}
function normalizeLinks(links){var ret={};fields.forEach(function(k){var v=String((links||{})[k]||"").trim();if(k==="instagram"&&v&&!v.startsWith("http"))v="https://instagram.com/"+v.replace(/^@/,"").replace(/^\/+/,"");
if(k==="whatsapp"&&v&&!v.startsWith("http"))v="https://wa.me/"+v.replace(/\D/g,"");ret[k]=valid(v)?v:""});return ret}
function normalize(c){var name=String(c.nome||"").trim(),id=String(c.slug||"").toLowerCase().trim();if(!name||!/^[a-z0-9-]{2,65}$/.test(id))throw Error("Nome ou identificador inválido");return {nome:name,slug:id,descricao:String(c.descricao||"").slice(0,200),tema:c.tema==="dark"?"dark":"blue",status:c.status==="inativo"?"inativo":"ativo",links:normalizeLinks(c.links)}}
function safeList(data){if(!data||!Array.isArray(data.clientes))throw Error("Arquivo sem lista de clientes");var a=data.clientes.map(normalize);if(new Set(a.map(function(x){return x.slug})).size!==a.length)throw Error("Identificadores repetidos");return a}
function link(c,t){return base+"?empresa="+encodeURIComponent(c.slug)+(t?"&acao="+encodeURIComponent(t):"")}
function fetchList(){return fetch(fileUrl+"?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("Falha ao carregar empresas");return r.json()}).then(safeList)}
function renderHome(){app.innerHTML='<section class="hero"><div class="eyebrow">TECNOLOGIA NFC + QR CODE</div><h1>Uma aproximação.<br><em>Infinitas conexões.</em></h1><p>Google Avaliações, Instagram, WhatsApp e outros canais da sua empresa reunidos em um único lugar.</p><a class="btn" href="?empresa=demo">Ver demonstração ↗</a><div class="features"><div class="feature"><span class="sym">◈</span><h3>Um único link</h3><p>Todos os canais do estabelecimento numa página fácil de usar.</p></div><div class="feature"><span class="sym">↗</span><h3>Atualização remota</h3><p>Troque o destino do link sem regravar a tag NFC.</p></div><div class="feature"><span class="sym">★</span><h3>Google Avaliações</h3><p>Leve o cliente até a tela oficial de avaliação do negócio.</p></div></div></section>'}
function renderPublic(){app.innerHTML='<section class="profile"><p>Carregando empresa...</p></section>';fetchList().then(function(items){var c=items.find(function(x){return x.slug===slug&&x.status==="ativo"});if(!c){app.innerHTML='<section class="profile card"><h1>Placa não encontrada</h1><p>Confira o endereço da plaquinha ou fale com o estabelecimento.</p></section>';return}
if(acao&&fields.includes(acao)&&valid(c.links[acao])){location.replace(c.links[acao]);return}
document.title=c.nome+" · NFC Central";var options=fields.filter(function(k){return valid(c.links[k])});var markup=options.map(function(k){return '<a class="linkitem" href="'+h(link(c,k))+'"><span>'+icons[k]+'</span>'+names[k]+'<b>↗</b></a>'}).join("");
app.innerHTML='<section class="profile"><div class="avatar">'+h(c.nome[0]).toUpperCase()+'</div><div class="eyebrow">PÁGINA DE LINKS</div><h1>'+h(c.nome)+'</h1><p>'+h(c.descricao||"Estamos a um toque de distância.")+'</p><div class="linkstack">'+(markup||'<p>Links em preparação.</p>')+'</div><p class="tiny">NFC Central • Aproxime, conecte e compartilhe.</p></section>'
}).catch(function(){app.innerHTML='<section class="profile card"><h2>Sem conexão</h2><p>Não foi possível carregar os links. Tente novamente.</p></section>'})}
if(!admin){if(slug)renderPublic();else renderHome();return}
document.title="Painel · NFC Central";var draftKey="nfc-central-v1-draft",companies=[],editing=null,selected=null;
app.innerHTML='<div class="flex between"><div><div class="eyebrow">GESTÃO DE PLAQUINHAS</div><h1 class="title">Painel NFC Central</h1><p class="muted">Cadastre empresas, configure destinos e prepare o QR Code.</p></div><button class="btn" id="new">+ Nova empresa</button></div>'+
'<div class="notice section"><b>Publicação pelo GitHub:</b> os cadastros deste painel são rascunhos no navegador. Depois de editar, clique em <b>Baixar clientes.json</b> e substitua o arquivo <b>data/clientes.json</b> no GitHub. Somente quem tem acesso ao repositório pode publicar mudanças. Não inclua dados privados.</div>'+
'<div class="card section"><div class="flex between"><div><h2>Empresas cadastradas <span id="count" class="pill">0</span></h2><p class="muted">Escolha um estabelecimento para gerar links.</p></div><input class="search" id="search" placeholder="Buscar empresa"></div><div id="rows"></div><div class="flex" style="margin-top:22px"><button id="export" class="btn">↓ Baixar clientes.json</button><button id="import" class="btn light">Importar cadastro</button><input id="file" type="file" accept=".json,application/json" class="hidden"></div></div>'+
'<section class="card section hidden" id="editor"><div class="flex between"><h2 id="etitle">Cadastrar empresa</h2><button class="btn light" id="cancel">Fechar</button></div><form id="form"><div class="formgrid">'+
'<div class="field"><label>Nome da empresa</label><input id="nome" maxlength="120" required></div><div class="field"><label>Identificador fixo</label><input id="slug" pattern="[a-z0-9-]{2,65}" required placeholder="empresa-exemplo"></div>'+
'<div class="field full"><label>Descrição</label><input id="descricao" maxlength="200" placeholder="Seu negócio a um toque de distância"></div>'+
'<div class="field"><label>Visual</label><select id="tema"><option value="blue">Azul</option><option value="dark">Escuro</option></select></div>'+
'<div class="field"><label>Status</label><select id="st"><option value="ativo">Ativa</option><option value="inativo">Inativa</option></select></div>'+
fields.map(function(k){return '<div class="field full"><label>'+names[k]+'</label><input id="l-'+k+'" placeholder="'+(k==="instagram"?"@usuario":k==="whatsapp"?"5555999999999":"https://...")+'"></div>'}).join("")+
'</div><div class="flex" style="margin-top:20px"><button type="submit" class="btn">Salvar rascunho</button><button type="button" class="btn light" id="cancel2">Cancelar</button></div></form></section>'+
'<section class="card section hidden" id="details"><div class="flex between"><div><h2 id="dtitle">Links</h2><p class="muted">Grave estes links na tag antes de bloqueá-la.</p></div><button class="btn light" id="closeDetails">Fechar</button></div><div class="linktable" id="linktable"></div><div class="qrbox section"><div><label>QR Code de acesso</label><select id="qrtype"><option value="">Página completa</option></select><p class="tiny">O QR usa um serviço externo de geração. Use apenas links públicos.</p><a id="qrdownload" target="_blank" rel="noopener" class="btn light">Abrir QR Code ↗</a></div><img id="qrimg" alt="QR Code de acesso"></div></section>'+
'<p class="tiny section">Sistema estático hospedado no GitHub Pages. Não possui login próprio, banco de dados ou cobrança automática. Não coloque senhas ou dados pessoais privados no cadastro.</p>';
function el(id){return document.getElementById(id)}
function saveDraft(){localStorage.setItem(draftKey,JSON.stringify({versao:1,clientes:companies}));renderList()}
function renderList(){var filter=el("search").value.toLowerCase().trim();el("count").textContent=companies.length;var a=companies.filter(function(c){return (c.nome+" "+c.slug).toLowerCase().includes(filter)});el("rows").innerHTML=a.length?a.map(function(c){return '<div class="client"><div class="initial">'+h(c.nome[0]).toUpperCase()+'</div><div><strong>'+h(c.nome)+'</strong><small>?empresa='+h(c.slug)+'</small></div><span class="pill '+(c.status==="inativo"?"off":"")+'">'+(c.status==="ativo"?"Ativa":"Inativa")+'</span><div class="actions"><button data-action="links" data-slug="'+h(c.slug)+'">Links</button><button data-action="edit" data-slug="'+h(c.slug)+'">Editar</button><button data-action="delete" data-slug="'+h(c.slug)+'">Excluir</button></div></div>'}).join(""):'<p class="muted">Nenhuma empresa encontrada.</p>'}
function edit(id){editing=id||null;var c=companies.find(function(x){return x.slug===id})||{nome:"",slug:"",descricao:"",tema:"blue",status:"ativo",links:{}};el("etitle").textContent=id?"Editar empresa":"Cadastrar empresa";el("nome").value=c.nome;el("slug").value=c.slug;el("slug").readOnly=!!id;el("descricao").value=c.descricao;el("tema").value=c.tema;el("st").value=c.status;fields.forEach(function(k){el("l-"+k).value=c.links[k]||""});el("details").classList.add("hidden");el("editor").classList.remove("hidden");el("editor").scrollIntoView({behavior:"smooth"})}
el("nome").addEventListener("input",function(){if(!editing)el("slug").value=el("nome").value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")});
el("form").onsubmit=function(e){e.preventDefault();try{var links={};fields.forEach(function(k){links[k]=el("l-"+k).value});var c=normalize({nome:el("nome").value,slug:el("slug").value,descricao:el("descricao").value,tema:el("tema").value,status:el("st").value,links:links});if(companies.some(function(x){return x.slug===c.slug&&x.slug!==editing}))throw Error("Já existe empresa com esse identificador");if(editing){companies[companies.findIndex(function(x){return x.slug===editing})]=c}else companies.push(c);saveDraft();el("editor").classList.add("hidden");showLinks(c.slug);tell("Rascunho salvo. Exporte o JSON para publicar.")}catch(err){tell(err.message)}};
function copy(s){if(navigator.clipboard){navigator.clipboard.writeText(s).then(function(){tell("Link copiado!")}).catch(function(){prompt("Copie este link:",s)})}else prompt("Copie este link:",s)}
function showLinks(id){selected=companies.find(function(c){return c.slug===id});if(!selected)return;el("editor").classList.add("hidden");el("dtitle").textContent="Links · "+selected.nome;var a=[["","Página completa"]].concat(fields.filter(function(k){return !!selected.links[k]}).map(function(k){return [k,names[k]]}));el("linktable").innerHTML=a.map(function(entry){var url=link(selected,entry[0]);return '<div class="linkrow"><strong>'+h(entry[1])+'</strong><span class="url">'+h(url)+'</span><div class="actions"><button data-copy="'+h(url)+'">Copiar</button><a class="btn light" style="padding:7px;font-size:12px" href="'+h(url)+'" target="_blank" rel="noopener">Testar ↗</a></div></div>'}).join("");el("qrtype").innerHTML=a.map(function(entry){return '<option value="'+h(entry[0])+'">'+h(entry[1])+'</option>'}).join("");renderQr();el("details").classList.remove("hidden");el("details").scrollIntoView({behavior:"smooth"})}
function renderQr(){if(!selected)return;var u=link(selected,el("qrtype").value),q="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=16&data="+encodeURIComponent(u);el("qrimg").src=q;el("qrdownload").href=q}
el("qrtype").onchange=renderQr;
el("linktable").onclick=function(e){var b=e.target.closest("[data-copy]");if(b)copy(b.dataset.copy)};
el("rows").onclick=function(e){var b=e.target.closest("[data-action]");if(!b)return;var id=b.dataset.slug,action=b.dataset.action;if(action==="edit")edit(id);if(action==="links")showLinks(id);if(action==="delete"&&confirm("Excluir esta empresa? Depois da publicação os links vão parar de funcionar.")){companies=companies.filter(function(c){return c.slug!==id});saveDraft();el("details").classList.add("hidden")}};
el("new").onclick=function(){edit(null)};el("search").oninput=renderList;
["cancel","cancel2"].forEach(function(id){el(id).onclick=function(){el("editor").classList.add("hidden")}});
el("closeDetails").onclick=function(){el("details").classList.add("hidden")};
el("export").onclick=function(){var data=new Blob([JSON.stringify({versao:1,clientes:companies},null,2)+"\n"],{type:"application/json"}),u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download="clientes.json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},3000);tell("Substitua data/clientes.json no GitHub.")};
el("import").onclick=function(){el("file").click()};
el("file").onchange=async function(e){var f=e.target.files[0];if(!f)return;try{var next=safeList(JSON.parse(await f.text()));if(confirm("Importar "+next.length+" empresas? Isso substituirá o rascunho atual.")){companies=next;saveDraft();tell("Cadastro importado.")}}catch(err){tell(err.message)}e.target.value=""};
try{var local=localStorage.getItem(draftKey);if(local){companies=safeList(JSON.parse(local));renderList()}else{fetchList().then(function(x){companies=x;renderList()}).catch(function(){renderList();tell("Não foi possível carregar o cadastro publicado.")})}}catch(e){companies=[];renderList()}
})();
</script></body></html>
