<body>
<div class="wrap"><aside class="sidebar"><a class="brand" href="../">✦ NFC<span>Central</span></a><div class="smallbrand">PAINEL DE GESTÃO</div>
<button class="navbutton active" data-tab="dashboard">◫ Visão geral</button>
<button class="navbutton" data-tab="pages">▤ Páginas</button>
<button class="navbutton" data-tab="tags">◈ Tags e placas</button>

<div class="main"><header class="head"><div class="heading"><h1 id="heading">Visão geral</h1><p id="subheading">Todas as suas páginas e tags em um só lugar.</p></div>
<div class="topActions"><span id="pending" class="dirty hide">● Alterações não publicadas</span><button class="btn secondary" id="exportTop">↓ Backup</button><button class="btn publish" id="publishTop">↑ Publicar no GitHub</button></div></header>
<main class="body" id="content"><div class="card">Carregando cadastros...</div></main></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
var REPO="MarcaAgenda/nfc-central",PATH="data/clientes.json",API="https://api.github.com/repos/"+REPO+"/contents/"+PATH,BASE=new URL("../",location.href).href;
var names={google:"Google Avaliações",instagram:"Instagram",whatsapp:"WhatsApp",maps:"Localização",menu:"Cardápio",booking:"Agendamento",website:"Site",pix:"Pix"};
var fields=Object.keys(names);var templates=[
 {id:"negocio",label:"Empresa / loja",descricao:"Tudo sobre nossa empresa em um só lugar."},
 {id:"barbearia",label:"Barbearia",descricao:"Agende seu horário e conheça nosso trabalho."},
 {id:"restaurante",label:"Restaurante",descricao:"Confira nosso cardápio, localização e faça seu pedido."},
 {id:"profissional",label:"Cartão profissional",descricao:"Conheça meu trabalho e entre em contato."},
 {id:"pagamento",label:"Pagamento Pix",descricao:"Acesse nossos canais e faça seu pagamento."}
];
var defaults={versao:2,clientes:[],tags:[]},data=structuredClone(defaults),sha=null,token="",connected=false,dirty=false,view="dashboard",editPage=null,editTag=null,selectedPage=null,selectedTag=null,filter="",draft="nfc-central-painel-v2-draft";
var container=document.getElementById("content");
function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function valid(u){try{var x=new URL(String(u));return x.protocol==="https:"||x.protocol==="http:"}catch(e){return false}}
function slugify(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,64)}
function normalized(json){
if(!json||!Array.isArray(json.clientes))throw Error("JSON de cadastro inválido.");
var out={versao:2,clientes:[],tags:[]};
out.clientes=json.clientes.map(function(c){
if(!c||!c.slug||!c.nome||!/^[a-z0-9-]{2,65}$/.test(c.slug))throw Error("Página com identificador inválido.");
var links={};fields.forEach(function(k){links[k]=valid((c.links||{})[k])?String(c.links[k]):""});
return {nome:String(c.nome).slice(0,120),slug:c.slug,descricao:String(c.descricao||"").slice(0,300),tema:["blue","dark","orange","sand","green","purple"].includes(c.tema)?c.tema:"blue",
 status:c.status==="inativo"?"inativo":"ativo",modelo:String(c.modelo||"negocio"),foto:valid(c.foto)?String(c.foto):"",links:links,
 extras:Array.isArray(c.extras)?c.extras.slice(0,15).filter(function(x){return x&&x.titulo&&valid(x.url)}).map(function(x){return {titulo:String(x.titulo).slice(0,60),url:String(x.url)}}):[]};
});
var ids=new Set();out.clientes.forEach(function(c){if(ids.has(c.slug))throw Error("Há páginas com identificadores repetidos.");ids.add(c.slug)});
out.tags=(Array.isArray(json.tags)?json.tags:[]).map(function(t){
if(!t||!/^[a-z0-9-]{2,65}$/.test(String(t.id||"")))throw Error("Tag com identificador inválido.");
return {id:String(t.id),tipo:["placa","cartao","adesivo","outro"].includes(t.tipo)?t.tipo:"outro",pagina:ids.has(t.pagina)?t.pagina:"",status:["ativa","estoque","pausada"].includes(t.status)?t.status:"estoque",nota:String(t.nota||"").slice(0,180)};
});
var tids=new Set();out.tags.forEach(function(t){if(tids.has(t.id))throw Error("Há tags repetidas.");tids.add(t.id)});return out;
}
function toast(x){var z=document.getElementById("toast");z.textContent=x;z.style.display="block";clearTimeout(window.__toast);window.__toast=setTimeout(function(){z.style.display="none"},4800)}
function setDirty(){dirty=true;try{localStorage.setItem(draft,JSON.stringify(data))}catch(e){}document.getElementById("pending").classList.remove("hide");}
function setClean(){dirty=false;localStorage.removeItem(draft);document.getElementById("pending").classList.add("hide")}
function pageUrl(x){return BASE+"?empresa="+encodeURIComponent(x.slug)}
function tagUrl(x){return BASE+"?tag="+encodeURIComponent(x.id)}
function qrSrc(url){return "https://api.qrserver.com/v1/create-qr-code/?size=480x480&margin=18&data="+encodeURIComponent(url)}
function copy(s){if(navigator.clipboard){navigator.clipboard.writeText(s).then(function(){toast("Link copiado!")}).catch(function(){prompt("Copie este link:",s)})}else prompt("Copie este link:",s)}
function safeUrl(u){var str=String(u||"").trim();if(str&&!valid(str))throw Error("Insira uma URL completa com https://");return str}
function tab(name){view=name;editPage=null;editTag=null;selectedPage=null;selectedTag=null;filter="";render()}
function render(){
var labels={dashboard:["Visão geral","Todas as suas páginas e tags em um só lugar."],pages:["Minhas páginas","Crie, personalize e duplique páginas sem mexer na NFC."],tags:["Tags e placas","Controle individual de cada NFC com endereço permanente."],settings:["Conexão e publicação","Publique com segurança na sua conta do GitHub."]};
document.getElementById("heading").textContent=labels[view][0];document.getElementById("subheading").textContent=labels[view][1];document.querySelectorAll("[data-tab]").forEach(function(e){e.classList.toggle("active",e.dataset.tab===view)});
if(view==="dashboard")dashboard();if(view==="pages")pages();if(view==="tags")tags();if(view==="settings")settings();
}
function dashboard(){
var active=data.tags.filter(function(t){return t.status==="ativa"}).length,unassigned=data.tags.filter(function(t){return !t.pagina||t.status==="estoque"}).length;
container.innerHTML='<div class="grid stats">'+
kpi("Páginas criadas",data.clientes.length,"Cada uma com seu próprio endereço.")+
kpi("NFCs cadastradas",data.tags.length,"Placas, cartões e adesivos.")+
kpi("Tags ativas",active,"Vinculadas para divulgação.")+
kpi("Em estoque / livres",unassigned,"Disponíveis para vincular.")+'</div>'+
'<div class="notice section"><b>Importante:</b> os links <b>?tag=...</b> ficam permanentes. Você pode trocar a página de destino depois, sem precisar regravar a NFC. O painel controla cadastros; estatísticas de leituras exigem um servidor de análise.</div>'+
'<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-top:22px">'+
'<div class="card"><h2 class="sectiontitle">Criar página nova</h2><p class="muted">Comece com um modelo pronto para barbearia, restaurante, loja, profissional ou Pix.</p><button class="btn" data-action="newpage">+ Criar página</button></div>'+
'<div class="card"><h2 class="sectiontitle">Registrar uma NFC</h2><p class="muted">Associe uma tag física à página certa e gere o link e QR Code.</p><button class="btn secondary" data-action="newtag">+ Cadastrar NFC</button></div>'+
'<div class="card"><h2 class="sectiontitle">Publicação</h2><p class="muted">'+(connected?'Conectado ao GitHub. Você pode publicar suas alterações.':'Conecte o GitHub para que as edições sejam publicadas automaticamente no site.')+'</p><button class="btn secondary" data-action="gotosettings">Configurar publicação ↗</button></div></div>'+
'<div class="card section"><h2 class="sectiontitle">Páginas cadastradas</h2><p class="muted">Acesse rapidamente seus clientes.</p><div class="tableWrap">'+tablePages(data.clientes.slice(0,8))+'</div></div>';
}
function kpi(label,number,desc){return '<div class="card kpi"><small>'+h(label)+'</small><strong>'+number+'</strong><span>'+h(desc)+'</span></div>'}
function status(c){return c==="ativo"||c==="ativa"?'<span class="badge">Ativa</span>':c==="pausada"||c==="inativo"?'<span class="badge red">Pausada</span>':'<span class="badge grey">Em estoque</span>'}
function tablePages(items){return items.length?'<table class="table"><thead><tr><th>Página / empresa</th><th>Modelo</th><th>Status</th><th>NFCs</th><th>Ações</th></tr></thead><tbody>'+items.map(function(c){
return '<tr><td><strong>'+h(c.nome)+'</strong><small>'+h(c.slug)+'</small></td><td>'+h(c.modelo||"negocio")+'</td><td>'+status(c.status)+'</td><td>'+data.tags.filter(function(t){return t.pagina===c.slug}).length+'</td><td class="actions"><button class="btn sm secondary" data-action="editpage" data-id="'+h(c.slug)+'">Editar</button> <button class="btn sm secondary" data-action="pageqr" data-id="'+h(c.slug)+'">Link / QR</button></td></tr>'}).join("")+'</tbody></table>':'<div class="empty">Nenhuma página cadastrada.</div>'}
function pages(){
if(editPage!==null){pageEditor();return}
if(selectedPage!==null){pageDetails();return}
var a=data.clientes.filter(function(c){return (c.nome+" "+c.slug).toLowerCase().includes(filter.toLowerCase())});
container.innerHTML='<div class="row"><div><h2 class="sectiontitle">Gerenciar páginas</h2><p class="muted">Páginas publicadas continuam com a mesma URL, mesmo após edições.</p></div><button class="btn" data-action="newpage">+ Nova página</button></div>'+
'<div class="card section"><div class="row"><div class="pills"><span class="badge grey">'+data.clientes.length+' cadastradas</span></div><input class="filter" id="search" placeholder="Buscar cliente ou página" value="'+h(filter)+'"></div><div class="tableWrap" style="margin-top:15px">'+tablePages(a)+'</div></div>';
var search=document.getElementById("search");search.addEventListener("input",function(){filter=search.value;pages()});
}
function pageEditor(){
var fresh=editPage==="__new__",original=fresh?null:data.clientes.find(function(c){return c.slug===editPage});
if(!fresh&&!original){editPage=null;pages();return}
var c=original||{nome:"",slug:"",descricao:"",tema:"blue",modelo:"negocio",status:"ativo",foto:"",links:{},extras:[]};
container.innerHTML='<div class="row"><div><h2 class="sectiontitle">'+(fresh?"Nova página":"Editar página")+'</h2><p class="muted">'+(fresh?"Escolha um modelo e personalize os links.":"Identificador fixo: "+h(c.slug))+'</p></div><button class="btn secondary" data-action="backpages">← Voltar</button></div>'+
'<form id="pageForm" class="split section"><div><div class="card"><h3 class="sectiontitle">Dados principais</h3><div class="fields">'+
field("Nome da página / empresa","nome",c.nome,'required maxlength="120"')+
field("Identificador permanente","slug",c.slug,(fresh?'required pattern="[a-z0-9-]{2,65}"':'readonly')+' maxlength="65"')+
'<div class="field"><label>Modelo inicial</label><select id="modelo">'+templates.map(function(t){return '<option value="'+t.id+'"'+(c.modelo===t.id?" selected":"")+'>'+h(t.label)+'</option>'}).join("")+'</select></div>'+
'<div class="field"><label>Cor / tema</label><select id="tema">'+[["blue","Azul profissional"],["dark","Escuro premium"],["orange","Laranja"],["sand","Bege elegante"],["green","Verde"],["purple","Roxo"]].map(function(t){return '<option value="'+t[0]+'"'+(c.tema===t[0]?" selected":"")+'>'+t[1]+'</option>'}).join("")+'</select></div>'+
'<div class="field full"><label>Descrição abaixo do nome</label><textarea id="descricao" maxlength="300">'+h(c.descricao)+'</textarea></div>'+
field("URL de foto ou logotipo (opcional)","foto",c.foto,'placeholder="https://.../logo.png"')+
'<div class="field"><label>Status da página</label><select id="status"><option value="ativo"'+(c.status==="ativo"?" selected":"")+'>Ativa</option><option value="inativo"'+(c.status==="inativo"?" selected":"")+'>Pausada</option></select></div>'+
'</div></div><div class="card section"><h3 class="sectiontitle">Botões e destinos</h3><p class="muted">Preencha apenas os canais que quer exibir. Use links completos começando com https://.</p>'+
fields.map(function(k){return '<div class="field" style="margin:15px 0"><label>'+h(names[k])+'</label><input id="link-'+k+'" placeholder="https://..." value="'+h((c.links||{})[k]||"")+'"></div>'}).join("")+
'</div><div class="card section"><div class="row"><div><h3 class="sectiontitle">Botões personalizados</h3><p class="muted">Para produtos, formulários, redes sociais e qualquer outro link.</p></div><button class="btn sm secondary" type="button" id="addExtra">+ Adicionar</button></div><div id="extraWrap">'+(c.extras||[]).map(extraRow).join("")+'</div></div>'+
'<div class="row section start"><button class="btn" type="submit">✓ Salvar alterações</button><button class="btn secondary" type="button" data-action="backpages">Cancelar</button></div></div>'+
'<aside><div class="card"><h3 class="sectiontitle">Prévia da página</h3><p class="muted">Exemplo do visual. Para conferir todos os detalhes, publique e abra a URL real.</p><div class="preview" id="preview"></div><div class="notice section">O endereço da página permanece igual quando os botões mudam. Nunca altere o slug depois que a tag for gravada.</div></div></aside></form>';
var n=document.getElementById("nome"),s=document.getElementById("slug");
if(fresh)n.addEventListener("input",function(){if(!s.dataset.manual)s.value=slugify(n.value)});s.addEventListener("input",function(){s.dataset.manual="1";s.value=slugify(s.value)});
document.getElementById("modelo").onchange=function(){if(!document.getElementById("descricao").value.trim())document.getElementById("descricao").value=templates.find(function(t){return t.id===this.value}).descricao;updatePreview()};
document.getElementById("addExtra").onclick=function(){var w=document.getElementById("extraWrap");if(w.querySelectorAll(".linkInput").length>=15){toast("Limite de 15 botões personalizados.");return}w.insertAdjacentHTML("beforeend",extraRow({titulo:"",url:""}));updatePreview()};
document.getElementById("extraWrap").onclick=function(e){if(e.target.closest("[data-remove]")){e.target.closest(".linkInput").remove();updatePreview()}};
document.getElementById("pageForm").addEventListener("input",updatePreview);
document.getElementById("pageForm").addEventListener("change",updatePreview);
document.getElementById("pageForm").onsubmit=function(e){e.preventDefault();try{
var slug=slugify(s.value),name=n.value.trim();if(name.length<2||!/^[a-z0-9-]{2,65}$/.test(slug))throw Error("Preencha nome e identificador válido (mínimo 2 caracteres).");
if(fresh&&data.clientes.some(function(x){return x.slug===slug}))throw Error("Já existe uma página com esse identificador.");
var links={};fields.forEach(function(k){links[k]=safeUrl(document.getElementById("link-"+k).value)});
var extras=Array.from(document.querySelectorAll(".linkInput")).map(function(el){return {titulo:el.querySelector(".extraTitle").value.trim(),url:el.querySelector(".extraUrl").value.trim()}}).filter(function(x){return x.titulo||x.url});
extras.forEach(function(x){if(!x.titulo||!valid(x.url))throw Error("Preencha nome e URL https:// de cada botão personalizado.")});
var next={nome:name,slug:slug,descricao:document.getElementById("descricao").value.trim(),tema:document.getElementById("tema").value,modelo:document.getElementById("modelo").value,status:document.getElementById("status").value,
 foto:safeUrl(document.getElementById("foto").value),links:links,extras:extras};
if(fresh)data.clientes.push(next);else data.clientes[data.clientes.findIndex(function(x){return x.slug===editPage})]=next;
setDirty();editPage=null;selectedPage=slug;toast("Página salva. Clique em Publicar no GitHub para colocar no ar.");render();
}catch(err){toast(err.message)}};
updatePreview();
}
function field(title,id,value,attrs){return '<div class="field"><label for="'+id+'">'+h(title)+'</label><input id="'+id+'" '+attrs+' value="'+h(value||"")+'"></div>'}
function extraRow(x){return '<div class="linkInput"><input class="extraTitle" maxlength="60" aria-label="Nome do botão" placeholder="Nome do botão" value="'+h(x.titulo)+'"><input class="extraUrl" aria-label="Link do botão" placeholder="https://..." value="'+h(x.url)+'"><button class="btn sm danger" type="button" data-remove title="Remover">×</button></div>'}
function updatePreview(){
var box=document.getElementById("preview");if(!box)return;
var nm=document.getElementById("nome").value||"Nome da empresa",d=document.getElementById("descricao").value||"Descrição da página";
var tema=document.getElementById("tema").value,col={blue:"#345ded",dark:"#a3c0ff",orange:"#ed701c",sand:"#a38158",green:"#188b6f",purple:"#815ae2"}[tema]||"#345ded";
box.style.background=tema==="dark"?"#171d2a":tema==="sand"?"#fffcf7":"#f9faff";box.style.color=tema==="dark"?"#f0f3fa":"#182338";
var foto=document.getElementById("foto").value,avatar=valid(foto)?'<img src="'+h(foto)+'" style="width:65px;height:65px;object-fit:cover;border-radius:19px" alt="">':h(nm.charAt(0).toUpperCase());
var keys=fields.filter(function(k){return document.getElementById("link-"+k).value.trim()}).map(function(k){return names[k]});
var extras=Array.from(document.querySelectorAll(".extraTitle")).map(function(x){return x.value.trim()}).filter(Boolean);
box.innerHTML='<div class="avatar" style="background:'+col+'">'+avatar+'</div><h3>'+h(nm)+'</h3><p>'+h(d)+'</p>'+(keys.concat(extras).slice(0,9).map(function(k){return '<div class="previewLink">'+h(k)+' &nbsp;↗</div>'}).join("")||'<p>Adicione links para visualizar seus botões.</p>');
}
function pageDetails(){
var c=data.clientes.find(function(x){return x.slug===selectedPage});if(!c){selectedPage=null;pages();return}
var url=pageUrl(c),attached=data.tags.filter(function(t){return t.pagina===c.slug});
container.innerHTML='<div class="row"><h2 class="sectiontitle">'+h(c.nome)+'</h2><button class="btn secondary" data-action="backpages">← Voltar</button></div>'+
'<div class="split section"><div class="card"><h3 class="sectiontitle">Página pública</h3><p class="muted">O endereço fica fixo mesmo que você edite o conteúdo.</p><p class="url">'+h(url)+'</p><div class="row start"><button class="btn secondary" data-action="copy" data-url="'+h(url)+'">Copiar link</button><a class="btn secondary" href="'+h(url)+'" target="_blank" rel="noopener">Abrir página ↗</a><button class="btn" data-action="editpage" data-id="'+h(c.slug)+'">Editar</button></div><div class="section"><h3 class="sectiontitle">NFCs vinculadas ('+attached.length+')</h3><p class="muted">'+(attached.length?attached.map(function(t){return h(t.id)}).join(" · "):"Nenhuma tag vinculada a esta página.")+'</p></div><div class="row start section"><button class="btn secondary" data-action="duplicatepage" data-id="'+h(c.slug)+'">Duplicar página</button><button class="btn danger" data-action="deletepage" data-id="'+h(c.slug)+'">Excluir</button></div></div>'+
'<aside class="card"><h3 class="sectiontitle">QR Code da página</h3><img class="qr" src="'+qrSrc(url)+'" alt="QR da página"><p class="muted">Use este QR para levar o cliente à página completa.</p><a class="btn secondary" href="'+qrSrc(url)+'" target="_blank" rel="noopener">Abrir QR em alta resolução ↗</a></aside></div>';
}
function tableTags(a){return a.length?'<table class="table"><thead><tr><th>Identificador</th><th>Tipo</th><th>Página vinculada</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+a.map(function(t){var c=data.clientes.find(function(c){return c.slug===t.pagina});
return '<tr><td><strong>'+h(t.id)+'</strong><small>'+h(t.nota||"Endereço permanente")+'</small></td><td>'+h(({placa:"Placa",cartao:"Cartão",adesivo:"Adesivo",outro:"Outro"})[t.tipo])+'</td><td>'+h(c?c.nome:"Sem página")+'</td><td>'+status(t.status)+'</td><td class="actions"><button class="btn sm secondary" data-action="edittag" data-id="'+h(t.id)+'">Editar</button> <button class="btn sm secondary" data-action="tagqr" data-id="'+h(t.id)+'">Link / QR</button></td></tr>'}).join("")+'</tbody></table>':'<div class="empty">Nenhuma tag cadastrada. Comece criando a primeira.</div>'}
function tags(){
if(editTag!==null){tagEditor();return}
if(selectedTag!==null){tagDetails();return}
var items=data.tags.filter(function(t){return (t.id+" "+t.tipo+" "+t.pagina).toLowerCase().includes(filter.toLowerCase())});
container.innerHTML='<div class="row"><div><h2 class="sectiontitle">Inventário de NFCs</h2><p class="muted">Identifique cada placa, adesivo e cartão separadamente.</p></div><button class="btn" data-action="newtag">+ Nova tag</button></div><div class="card section"><div class="row"><span class="badge grey">'+data.tags.length+' NFCs cadastradas</span><input class="filter" id="search" placeholder="Buscar identificação, tipo ou empresa" value="'+h(filter)+'"></div><div class="tableWrap" style="margin-top:15px">'+tableTags(items)+'</div></div>'+
'<div class="notice section">Cada NFC deve ser gravada com o link <b>?tag=identificador</b>, nunca diretamente com o link do cliente. Assim, você pode reutilizar a mesma NFC e alterar a empresa pelo painel sem regravá-la. Não coloque informações privadas no campo de observação.</div>';
document.getElementById("search").oninput=function(){filter=this.value;tags()};
}
function nextTag(){var n=1;while(data.tags.some(function(t){return t.id==="tag-"+String(n).padStart(3,"0")}))n++;return "tag-"+String(n).padStart(3,"0")}
function tagEditor(){
var fresh=editTag==="__new__",t=fresh?{id:nextTag(),tipo:"placa",pagina:"",status:"estoque",nota:""}:data.tags.find(function(t){return t.id===editTag});
if(!t){editTag=null;tags();return}
container.innerHTML='<div class="row"><h2 class="sectiontitle">'+(fresh?"Cadastrar nova NFC":"Editar NFC "+h(t.id))+'</h2><button class="btn secondary" data-action="backtags">← Voltar</button></div>'+
'<form id="tagForm" class="card section"><div class="fields">'+
field("Identificador fixo da NFC","tagId",t.id,(fresh?'required pattern="[a-z0-9-]{2,65}"':'readonly')+' maxlength="65"')+
'<div class="field"><label>Tipo de produto</label><select id="tipo">'+[["placa","Placa NFC"],["cartao","Cartão NFC"],["adesivo","Tag adesiva"],["outro","Outro"]].map(function(p){return '<option value="'+p[0]+'"'+(p[0]===t.tipo?" selected":"")+'>'+p[1]+'</option>'}).join("")+'</select></div>'+
'<div class="field"><label>Página vinculada</label><select id="pagina"><option value="">Nenhuma — em estoque</option>'+data.clientes.map(function(p){return '<option value="'+h(p.slug)+'"'+(p.slug===t.pagina?" selected":"")+'>'+h(p.nome)+'</option>'}).join("")+'</select></div>'+
'<div class="field"><label>Status da NFC</label><select id="status"><option value="estoque"'+(t.status==="estoque"?" selected":"")+'>Em estoque</option><option value="ativa"'+(t.status==="ativa"?" selected":"")+'>Ativa</option><option value="pausada"'+(t.status==="pausada"?" selected":"")+'>Pausada</option></select></div>'+
'<div class="field full"><label>Observação pública (não coloque telefone ou dados confidenciais)</label><input id="nota" maxlength="180" value="'+h(t.nota)+'" placeholder="Ex.: Placa balcão principal"></div></div>'+
'<div class="row start section"><button class="btn" type="submit">✓ Salvar NFC</button><button class="btn secondary" data-action="backtags" type="button">Cancelar</button></div></form>';
document.getElementById("tagForm").onsubmit=function(e){e.preventDefault();try{var id=slugify(document.getElementById("tagId").value);
if(!/^[a-z0-9-]{2,65}$/.test(id))throw Error("Identificador inválido.");
if(fresh&&data.tags.some(function(t){return t.id===id}))throw Error("Já existe NFC com esse identificador.");
var n={id:id,tipo:document.getElementById("tipo").value,pagina:document.getElementById("pagina").value,status:document.getElementById("status").value,nota:document.getElementById("nota").value.trim()};
if(n.status==="ativa"&&!n.pagina)throw Error("Vincule uma página antes de ativar a NFC.");
if(fresh)data.tags.push(n);else data.tags[data.tags.findIndex(function(x){return x.id===editTag})]=n;
setDirty();editTag=null;selectedTag=id;toast("NFC salva. Publique no GitHub para ativar as mudanças.");render();
}catch(er){toast(er.message)}};
}
function tagDetails(){
var t=data.tags.find(function(x){return x.id===selectedTag});if(!t){selectedTag=null;tags();return}
var page=data.clientes.find(function(p){return p.slug===t.pagina}),url=tagUrl(t);
container.innerHTML='<div class="row"><h2 class="sectiontitle">NFC '+h(t.id)+'</h2><button class="btn secondary" data-action="backtags">← Voltar</button></div>'+
'<div class="split section"><div class="card"><h3 class="sectiontitle">Link permanente da NFC</h3><p class="muted">Grave exatamente este endereço na tag física. Ele continuará igual quando você mudar a página vinculada.</p><p class="url">'+h(url)+'</p><div class="row start"><button class="btn" data-action="copy" data-url="'+h(url)+'">Copiar URL</button><a class="btn secondary" href="'+h(url)+'" target="_blank" rel="noopener">Testar ↗</a></div>'+
'<div class="section"><h3 class="sectiontitle">Configuração atual</h3><p class="muted">Destino: '+h(page?page.nome:"Nenhuma página vinculada")+'<br>Tipo: '+h(t.tipo)+'<br>Status: '+h(t.status)+'</p></div>'+
'<div class="row start section"><button class="btn secondary" data-action="edittag" data-id="'+h(t.id)+'">Alterar página / editar</button><button class="btn danger" data-action="deletetag" data-id="'+h(t.id)+'">Excluir NFC</button></div></div>'+
'<aside class="card"><h3 class="sectiontitle">QR Code individual</h3><img class="qr" src="'+qrSrc(url)+'" alt="QR da tag"><p class="muted">O mesmo identificador pode ser usado em um QR Code impresso ou em uma tag NFC.</p><a class="btn secondary" href="'+qrSrc(url)+'" target="_blank" rel="noopener">Abrir QR em alta resolução ↗</a></aside></div>';
}
function settings(){
container.innerHTML='<div class="card"><h2 class="sectiontitle">Conexão com o GitHub</h2>'+
(connected?'<div class="connected">✓ Conectado ao repositório '+REPO+'. O token fica apenas na memória desta aba e será apagado ao fechá-la.</div><div class="row start section"><button class="btn secondary" id="disconnect">Desconectar</button><button class="btn secondary" id="sync">Recarregar do GitHub</button></div>':
'<p class="muted">Para publicar páginas e tags em tempo real, conecte um <b>Fine-grained personal access token</b> do GitHub com acesso somente ao repositório <b>'+REPO+'</b> e permissão de <b>Contents: Read and write</b>.</p>'+
'<div class="loginGrid section"><div class="field"><label>Token de acesso GitHub</label><input type="password" id="githubToken" autocomplete="off" spellcheck="false" placeholder="github_pat_..."></div><button id="connect" class="btn">Conectar</button></div>'+
'<p class="hint">O token não é salvo no navegador nem enviado a terceiros: ele é usado nesta aba somente para comunicar com api.github.com. Não cole seu token no chat ou o adicione a arquivos públicos.</p>'+
'<a class="url" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Criar token com permissões limitadas no GitHub ↗</a>')+
'</div><div class="card section"><h2 class="sectiontitle">Publicar alterações</h2><p class="muted">Você pode salvar tudo em um arquivo de backup ou publicar diretamente no GitHub. Publicar atualiza o arquivo <b>data/clientes.json</b>. As páginas e NFCs apontam sempre para os mesmos endereços.</p><div class="row start"><button id="publishSettings" class="btn publish">↑ Publicar alterações</button><button id="exportSettings" class="btn secondary">↓ Baixar backup JSON</button><button id="importSettings" class="btn secondary">↑ Importar backup JSON</button><input class="hide" type="file" accept="application/json,.json" id="importFile"></div><p class="hint">Se outra pessoa alterar o repositório simultaneamente, a publicação será bloqueada para evitar sobrescrever os dados dela.</p></div>'+
'<div class="notice section"><b>Limites desta versão:</b> o GitHub Pages hospeda páginas estáticas. Não há contador confiável de aproximações NFC, login de clientes ou cobrança mensal automática. Esses recursos precisam de backend e banco de dados. O arquivo de páginas é público; cadastre apenas informações que podem aparecer na internet.</div>';
var d=document.getElementById("disconnect");if(d)d.onclick=function(){token="";connected=false;sha=null;toast("Desconectado.");render()};
var connect=document.getElementById("connect");if(connect)connect.onclick=function(){connectGithub(document.getElementById("githubToken").value)};
var sync=document.getElementById("sync");if(sync)sync.onclick=reloadGitHub;
document.getElementById("publishSettings").onclick=publish;
document.getElementById("exportSettings").onclick=exportData;
document.getElementById("importSettings").onclick=function(){document.getElementById("importFile").click()};
document.getElementById("importFile").onchange=importFile;
}
function base64(text){
var bytes=new TextEncoder().encode(text),str="";for(var i=0;i<bytes.length;i+=8192){str+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192))}return btoa(str)
}
function fromBase64(str){var raw=atob(str.replace(/\s/g,"")),arr=Uint8Array.from(raw,function(c){return c.charCodeAt(0)});return new TextDecoder("utf-8").decode(arr)}
async function github(method,body){
var r=await fetch(API,{method:method,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
var x=await r.json().catch(function(){return {}});
if(!r.ok){var err=new Error(x.message||"GitHub respondeu "+r.status);err.status=r.status;throw err}return x
}
async function connectGithub(input){
if(!input||!input.trim()){toast("Cole o token do GitHub.");return}
if(dirty&&!confirm("Existem mudanças locais. Conectar vai carregar o conteúdo publicado e pode substituí-las. Deseja continuar?"))return;
token=input.trim();
try{var x=await github("GET");data=normalized(JSON.parse(fromBase64(x.content)));sha=x.sha;connected=true;setClean();toast("Conectado ao GitHub. Pronto para publicar!");render()}catch(e){token="";connected=false;sha=null;toast("Não foi possível conectar: "+e.message)}
}
async function reloadGitHub(){
if(dirty&&!confirm("Descartar alterações locais não publicadas e recarregar do GitHub?"))return;
try{var x=await github("GET");data=normalized(JSON.parse(fromBase64(x.content)));sha=x.sha;setClean();toast("Atualizado com os dados do GitHub.");render()}catch(e){toast("Falha ao recarregar: "+e.message)}
}
async function publish(){
if(!connected){view="settings";render();toast("Conecte o GitHub antes de publicar.");return}
if(!dirty){toast("Nenhuma alteração pendente de publicação.");return}
try{
var x=await github("PUT",{message:"NFC Central: atualiza páginas e tags pelo painel",content:base64(JSON.stringify(data,null,2)+"\n"),sha:sha,branch:"main"});
sha=x.content.sha;setClean();toast("Publicado com sucesso! O GitHub Pages atualizará o site.");render();
}catch(e){if(e.status===409||e.status===422){toast("Conflito no GitHub. Faça backup e recarregue os dados antes de tentar publicar.");return}toast("Falha ao publicar: "+e.message)}
}
function exportData(){var b=new Blob([JSON.stringify(data,null,2)+"\n"],{type:"application/json"}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download="nfc-central-backup.json";a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000);toast("Backup baixado. Guarde este arquivo.")}
async function importFile(e){var file=e.target.files[0];if(!file)return;try{var j=normalized(JSON.parse(await file.text()));if(confirm("Importar "+j.clientes.length+" páginas e "+j.tags.length+" tags? Isso substituirá os dados em edição.")){data=j;setDirty();toast("Backup importado. Publique para colocar as alterações no ar.");render()}}catch(er){toast("Arquivo inválido: "+er.message)}e.target.value=""}
document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab(this.dataset.tab)}});
document.getElementById("publishTop").onclick=publish;
document.getElementById("exportTop").onclick=exportData;
container.addEventListener("click",function(e){
var b=e.target.closest("[data-action]");if(!b)return;var a=b.dataset.action,id=b.dataset.id;
if(a==="newpage"){view="pages";editPage="__new__";render()}
else if(a==="newtag"){view="tags";editTag="__new__";render()}
else if(a==="gotosettings"){tab("settings")}
else if(a==="editpage"){view="pages";selectedPage=null;editPage=id;render()}
else if(a==="edittag"){view="tags";selectedTag=null;editTag=id;render()}
else if(a==="pageqr"){view="pages";selectedPage=id;render()}
else if(a==="tagqr"){view="tags";selectedTag=id;render()}
else if(a==="backpages"){editPage=null;selectedPage=null;render()}
else if(a==="backtags"){editTag=null;selectedTag=null;render()}
else if(a==="copy"){copy(b.dataset.url)}
else if(a==="duplicatepage"){var c=data.clientes.find(function(x){return x.slug===id});if(!c)return;var j=1,slug;do{slug=c.slug+"-copia"+j++;}while(data.clientes.some(function(x){return x.slug===slug}));data.clientes.push(Object.assign({},structuredClone(c),{nome:c.nome+" (cópia)",slug:slug}));setDirty();selectedPage=slug;toast("Página duplicada. Publique para colocar no ar.");render()}
else if(a==="deletepage"){var p=data.clientes.find(function(x){return x.slug===id});if(!p)return;var associated=data.tags.filter(function(x){return x.pagina===id}).length;if(!confirm("Excluir '"+p.nome+"'? "+associated+" NFC(s) perderão a página vinculada e o link da página deixará de funcionar."))return;data.clientes=data.clientes.filter(function(x){return x.slug!==id});data.tags.forEach(function(x){if(x.pagina===id){x.pagina="";x.status="estoque"}});setDirty();selectedPage=null;render()}
else if(a==="deletetag"){if(!confirm("Excluir '"+id+"'? O endereço permanente desta NFC deixará de funcionar depois de publicar."))return;data.tags=data.tags.filter(function(x){return x.id!==id});setDirty();selectedTag=null;render()}
});
fetch(new URL("../data/clientes.json",location.href).href+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("O arquivo publicado não está disponível.");return r.json()}).then(function(j){data=normalized(j);var local=localStorage.getItem(draft);if(local&&confirm("Foi encontrado um rascunho local não publicado. Deseja restaurar?")){try{data=normalized(JSON.parse(local));setDirty();toast("Rascunho restaurado.")}catch(e){toast("Falha ao restaurar: "+e.message)}}render()}).catch(function(e){toast("Não foi possível carregar os dados publicados: "+e.message);render()});
})();
</script></body></html>
